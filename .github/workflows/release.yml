name: Release (macOS + Windows + Linux)

# 一次触发产出三平台工件，并在推送 v* 标签时创建 GitHub Release。
#
# 触发：
#   - 手动运行（Actions → Release → Run workflow）：只构建并上传工件，不创建 Release
#   - 推送 v* 标签：先校验标签与 package.json 版本一致，构建三平台后创建 Release 并附上全部产物
#
# 平台与产物：
#   - macOS（macos-14 / arm64）：.dmg + .app
#   - Windows（windows-latest）：NSIS .exe + 便携版 .zip
#   - Linux（ubuntu-22.04）：.deb + .rpm + .AppImage
# 每个平台都会生成一份 SHA256SUMS-<platform>.txt 一并附到 Release。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: 版本校验与测试
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 校验标签与 package.json 版本一致
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package.json 版本：${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "${TAG}" != "${VERSION}" ]; then
              echo "::error::标签 v${TAG} 与 package.json 版本 ${VERSION} 不一致，请先统一版本号"
              exit 1
            fi
          fi

      - name: 校验四处版本号一致（package.json / Cargo.toml / Cargo.lock / tauri.conf.json）
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json').version;
          const tauri = require('./src-tauri/tauri.conf.json').version;
          const cargo = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8')
            .match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          // Cargo.lock 里本包的版本块：`name = "personal-knowledge-os"` 紧跟 `version = "..."`
          const lock = fs.readFileSync('./src-tauri/Cargo.lock', 'utf8');
          const lockVersion = lock
            .split('\n')
            .findIndex((line) => line.trim() === 'name = "personal-knowledge-os"');
          const lockEntry = lockVersion >= 0
            ? lock.split('\n').slice(lockVersion, lockVersion + 3).join('\n')
            : '';
          const locked = lockEntry.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const versions = { pkg, tauri, cargo, lock: locked };
          const unique = new Set(Object.values(versions));
          if (unique.size !== 1 || !locked) {
            console.error(`版本号不一致：${JSON.stringify(versions)}`);
            process.exit(1);
          }
          console.log(`版本号一致（四处）：${pkg}`);
          NODE

      - name: 标签发布必须配置 updater 签名密钥
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATER_PUBKEY: ${{ secrets.PKOS_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${UPDATER_PUBKEY}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::v* 发布必须配置 PKOS_UPDATER_PUBKEY 与 TAURI_SIGNING_PRIVATE_KEY；不允许发布无签名更新"
            exit 1
          fi

      - name: 标签发布必须配置 macOS Developer ID 与公证凭据
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD}" ] || [ -z "${APPLE_SIGNING_IDENTITY}" ] || \
             [ -z "${APPLE_ID}" ] || [ -z "${APPLE_PASSWORD}" ] || [ -z "${APPLE_TEAM_ID}" ]; then
            echo "::error::v* 发布必须配置 Developer ID 证书与公证凭据（APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID）"
            exit 1
          fi

      - name: 标签发布必须配置 Windows 代码签名证书
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${WINDOWS_CERTIFICATE}" ] || [ -z "${WINDOWS_CERTIFICATE_PASSWORD}" ]; then
            echo "::error::v* 发布必须配置 WINDOWS_CERTIFICATE 与 WINDOWS_CERTIFICATE_PASSWORD"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 不写 version：版本由 package.json 的 packageManager 决定。
        # 两处都写会直接失败（ERR_PNPM_BAD_PM_VERSION：Multiple versions of pnpm specified）——
        # 2026-10-14 第一次跑流水线就是这么挂的。

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 版本：本机验证口径是 v22.16；pnpm 11 要求 **≥ v22.13**，
          # 之前写 20 会在 Setup Node 之后直接报「This version of pnpm requires at least Node.js v22.13」。
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: 安装固定版本 cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: 审计 Rust 依赖漏洞
        run: cargo audit --file src-tauri/Cargo.lock --no-yanked

      # Linux 上 tauri/wry 的链接需要这些系统开发包；preflight 里也要跑 cargo test，
      # 所以这里必须装（清单与 linux 打包 job 一致）——否则 cargo test 直接链接失败。
      - name: 安装 Linux 系统依赖（跑 cargo test 用）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            build-essential \
            pkg-config \
            libssl-dev

      - name: 前端与 Rust 测试
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test:acceptance
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          pnpm test:release-manifest
          pnpm test:release-workflow
          pnpm test:update-signature
          pnpm test
          cd src-tauri
          # 基准用例是 #[ignore]，这里跑常规测试
          cargo test

  macos:
    name: macOS 打包（arm64）
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 不写 version：版本由 package.json 的 packageManager 决定。
        # 两处都写会直接失败（ERR_PNPM_BAD_PM_VERSION：Multiple versions of pnpm specified）——
        # 2026-10-14 第一次跑流水线就是这么挂的。

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 版本：本机验证口径是 v22.16；pnpm 11 要求 **≥ v22.13**，
          # 之前写 20 会在 Setup Node 之后直接报「This version of pnpm requires at least Node.js v22.13」。
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: 构建 .app + .dmg
        env:
          PKOS_UPDATER_PUBKEY: ${{ secrets.PKOS_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm install --frozen-lockfile
          CONFIGS=""
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ] && [ -n "${PKOS_UPDATER_PUBKEY}" ]; then
            CONFIGS="--config src-tauri/tauri.updater.conf.json"
          fi
          if [ -n "${APPLE_SIGNING_IDENTITY}" ]; then
            MACOS_SIGN_CONFIG="${RUNNER_TEMP}/tauri.macos-sign.json"
            node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({bundle:{macOS:{signingIdentity:process.env.APPLE_SIGNING_IDENTITY}}}))" "${MACOS_SIGN_CONFIG}"
            CONFIGS="${CONFIGS} --config ${MACOS_SIGN_CONFIG}"
          fi
          pnpm tauri build ${CONFIGS} --bundles app dmg

      - name: 生成校验值
        run: |
          cd src-tauri/target/release/bundle
          # 只写哈希行：以前这里还塞了一行 `du -k` 的体积输出，
          # 结果用户跑 `shasum -a 256 -c SHA256SUMS-macos.txt` 会报「1 line is improperly formatted」、
          # 并以非 0 退出——等于这份校验文件自己过不了自己的校验（2026-10-14 v1.3.0 发布后发现）。
          #
          # 文件名按**用户下载到的资产名**写（空格 → 点、去掉目录层级）：
          # GitHub 上传资产时会把空格换成点，写 `dmg/Personal Knowledge OS_x.dmg` 的话，
          # 用户在下载目录里跑 `shasum -c` 只会得到「No such file or directory」。
          for f in dmg/*.dmg macos/*.tar.gz macos/*.sig; do
            [ -e "$f" ] || continue
            printf '%s  %s\n' "$(shasum -a 256 "$f" | cut -d' ' -f1)" "$(basename "$f" | tr ' ' '.')"
          done > "$GITHUB_WORKSPACE/SHA256SUMS-macos.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS-macos.txt"

      - name: 上传工件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkos-macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
            SHA256SUMS-macos.txt

  windows:
    name: Windows 打包（NSIS + 便携版）
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 不写 version：版本由 package.json 的 packageManager 决定。
        # 两处都写会直接失败（ERR_PNPM_BAD_PM_VERSION：Multiple versions of pnpm specified）——
        # 2026-10-14 第一次跑流水线就是这么挂的。

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 版本：本机验证口径是 v22.16；pnpm 11 要求 **≥ v22.13**，
          # 之前写 20 会在 Setup Node 之后直接报「This version of pnpm requires at least Node.js v22.13」。
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: 导入 Windows 代码签名证书
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "未配置 Windows 证书：手动构建将生成未签名安装包"
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "pkos-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item $certificatePath

      - name: 构建 NSIS 安装包
        shell: bash
        # 证书已在上一步导入 Windows 证书库；这里通过磁盘上的动态 JSON 注入 thumbprint。
        env:
          PKOS_UPDATER_PUBKEY: ${{ secrets.PKOS_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          CONFIGS=""
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ] && [ -n "${PKOS_UPDATER_PUBKEY}" ]; then
            CONFIGS="--config src-tauri/tauri.updater.conf.json"
          fi
          if [ -n "${WINDOWS_CERTIFICATE_THUMBPRINT}" ]; then
            WINDOWS_SIGN_CONFIG="${RUNNER_TEMP}/tauri.windows-sign.json"
            node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({bundle:{windows:{certificateThumbprint:process.env.WINDOWS_CERTIFICATE_THUMBPRINT,digestAlgorithm:'sha256',timestampUrl:'http://timestamp.digicert.com'}}}))" "${WINDOWS_SIGN_CONFIG}"
            CONFIGS="${CONFIGS} --config ${WINDOWS_SIGN_CONFIG}"
          fi
          pnpm tauri build ${CONFIGS} --bundles nsis

      - name: 生成便携版 zip 与校验值
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $release = "src-tauri/target/release"
          $nsis = Get-ChildItem "$release/bundle/nsis/*.exe" | Select-Object -First 1
          $portableDir = "dist-windows"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $nsis.FullName "$portableDir/Personal Knowledge OS_${version}_x64-setup.exe"
          Copy-Item "$release/personal-knowledge-os.exe" "$portableDir/Personal Knowledge OS.exe"
          Compress-Archive -Force -Path "$portableDir/Personal Knowledge OS.exe" `
            -DestinationPath "$portableDir/Personal Knowledge OS_${version}_x64-portable.zip"
          Remove-Item "$portableDir/Personal Knowledge OS.exe"
          # 名字按用户下载到的资产名写（空格 → 点）：GitHub 上传资产时会做这个替换，
          # 否则用户在下载目录里校验会对不上文件名。
          #
          # 行尾必须写 **LF**：PowerShell 的 Out-File / Set-Content 默认写 CRLF，
          # 在 macOS / Linux 上 `shasum -c` / `sha256sum -c` 会把文件名末尾的 \r 当成文件名的一部分，
          # 于是报「No such file or directory」。这里直接拼字符串、显式写 LF + 无 BOM。
          $lines = Get-ChildItem "$portableDir/*.exe", "$portableDir/*.zip", "$release/bundle/nsis/*.sig" |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name -replace ' ','.')" }
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS-windows.txt'
          [System.IO.File]::WriteAllText(
            $checksumPath,
            (($lines -join "`n") + "`n"),
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content "$env:GITHUB_WORKSPACE/SHA256SUMS-windows.txt"

      - name: 上传工件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkos-windows
          if-no-files-found: error
          path: |
            dist-windows/*.exe
            dist-windows/*.zip
            src-tauri/target/release/bundle/nsis/*.sig
            SHA256SUMS-windows.txt

  linux:
    name: Linux 打包（deb + rpm + AppImage）
    needs: preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 不写 version：版本由 package.json 的 packageManager 决定。
        # 两处都写会直接失败（ERR_PNPM_BAD_PM_VERSION：Multiple versions of pnpm specified）——
        # 2026-10-14 第一次跑流水线就是这么挂的。

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 版本：本机验证口径是 v22.16；pnpm 11 要求 **≥ v22.13**，
          # 之前写 20 会在 Setup Node 之后直接报「This version of pnpm requires at least Node.js v22.13」。
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: 构建 deb / rpm / AppImage
        env:
          PKOS_UPDATER_PUBKEY: ${{ secrets.PKOS_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ] && [ -n "${PKOS_UPDATER_PUBKEY}" ]; then
            pnpm tauri build --config src-tauri/tauri.updater.conf.json --bundles deb rpm appimage
          else
            pnpm tauri build --bundles deb rpm appimage
          fi

      - name: 生成校验值
        run: |
          cd src-tauri/target/release/bundle
          # 同 macOS：文件名按用户下载到的资产名写（空格 → 点、去掉目录层级）
          find . -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.sig' \) -print \
            | sort | while read -r f; do
                printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f" | tr ' ' '.')"
              done > "$GITHUB_WORKSPACE/SHA256SUMS-linux.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS-linux.txt"

      - name: 上传工件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkos-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            SHA256SUMS-linux.txt

  release:
    name: 创建 GitHub Release
    needs: [preflight, macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 下载全部工件
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: 汇总产物清单
        run: |
          find dist -type f | sort
          # 统一成 LF：即使某个平台的校验文件带 CRLF，汇总文件也必须能在
          # macOS / Linux 上用 `shasum -c` / `sha256sum -c` 直接通过。
          cat dist/*/SHA256SUMS-*.txt 2>/dev/null | tr -d '\r' > dist/SHA256SUMS-all.txt || true
          cat dist/SHA256SUMS-all.txt

      - name: 生成签名更新清单 latest.json
        env:
          PKOS_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          PKOS_RELEASE_TAG: ${{ github.ref_name }}
          PKOS_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
          PKOS_RELEASE_NOTES: Personal Knowledge OS ${{ github.ref_name }}
        run: node scripts/release/update-manifest.mjs

      - name: 创建 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Personal Knowledge OS ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 产物

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | macOS（arm64） | `*.dmg` | Developer ID 签名并通过公证；应用内更新包另带 minisign 签名 |
            | Windows（x64） | `*_x64-setup.exe` / `*_x64-portable.zip` | Authenticode 代码签名；应用内更新包另带 minisign 签名 |
            | Linux（x64） | `*.deb` / `*.rpm` / `*.AppImage` | 需要 WebKitGTK 4.1；AppImage 需 `chmod +x`；应用内更新使用签名的 `*.AppImage.tar.gz` |

            校验值见 `SHA256SUMS-*.txt`。下载后在**同一个目录**里执行
            `shasum -a 256 -c SHA256SUMS-all.txt`（Linux 用 `sha256sum -c`）应全部 OK。
            安装与验收文档：
            [验收记录](./docs/acceptance/) · [Windows 安装](./docs/WINDOWS_INSTALL_GUIDE.md) ·
            [Linux 安装](./docs/LINUX_INSTALL_GUIDE.md) · [完全指南](./docs/GUIDE.md)
