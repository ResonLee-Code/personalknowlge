name: Linux release

# 在真实 Linux 运行器上构建 deb / rpm / AppImage（Tauri 不支持从 macOS 交叉编译到 Linux）。
#
# 触发：
#   - 手动运行（Actions → Linux release → Run workflow）
#   - 推送 v* 标签（与 Windows 工作流一致）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm test
          cd src-tauri
          cargo test

      - name: Build packages (deb / rpm / appimage)
        run: pnpm tauri build --bundles deb rpm appimage

      - name: Compute checksums
        run: |
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec sha256sum {} \; | tee checksums-linux.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: personal-knowledge-os-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            checksums-linux.txt
