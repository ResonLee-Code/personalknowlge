name: Windows release

# 在真实 Windows 运行器上构建安装包（交叉编译只能产出未签名的 exe）。
#
# 触发：
#   - 手动运行（Actions → Windows release → Run workflow）
#   - 推送 v* 标签（同时创建 Release 并附带安装包）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm test
          cd src-tauri
          cargo test

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: personal-knowledge-os-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/personal-knowledge-os.exe

      - name: Attach installer to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
